# Tes otomatis: berjalan di GitHub setiap ada PR dan setiap ada perubahan di main.
# Hasilnya muncul sebagai ✅ / ❌ di halaman PR, jadi kamu tidak perlu menjalankan tes sendiri.
name: Tes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  skrip:
    name: cek-skrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck sudah terpasang di runner Ubuntu GitHub
      - run: shellcheck -x rilis scripts/uji-pr scripts/balik-main scripts/_common.sh scripts/pengaturan.sh
